<svg xmlns="http://www.w3.org/2000/svg" fill="#ffffff" height="800px" width="800px" version="1.1" viewBox="0 0 297 297" enable-background="new 0 0 297 297">
  <style>
    @keyframes needleMove {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
    @keyframes fabricMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-5px); }
    }
    @keyframes wheelRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #needle {
      animation: needleMove 0.6s infinite ease-in-out;
      transform-origin: center;
    }
    #fabric {
      animation: fabricMove 1.2s infinite linear alternate;
    }
    #wheel {
      animation: wheelRotate 1.5s infinite linear;
      transform-origin: center;
    }
  </style>
